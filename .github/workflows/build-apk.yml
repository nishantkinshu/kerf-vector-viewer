name: Build APK

on:
  push:
  workflow_dispatch:

# Lets the build publish the APK on the repo's "Releases" page
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Copy viewer page into the app
        run: python3 tools/build_web.py

      # The app's signing key lives in the repository secret KERF_KEYSTORE (kept private, never in the code).
      # With it, every build is signed the same way, so new APKs install over old ones as updates.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KERF_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/kerf-debug.keystore; echo "Signing key restored"; else echo "No KERF_KEYSTORE secret: using a temporary key"; fi

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Kerf-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Also put the APK on the Releases page, so it's a direct download (no zip)
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kerf-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kerf build ${{ github.run_number }}
          body: Built automatically from the latest code. Download the .apk below and open it on your phone or tablet.
          files: Kerf-build-${{ github.run_number }}.apk
          make_latest: true
